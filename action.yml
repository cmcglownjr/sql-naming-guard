name: "SQL Naming Guard"
description: "Fail if SQL scripts use database-qualified table names"

inputs:
  sql-path:
    description: "Directory containing SQL files"
    required: false
    default: "."

  strict:
    description: "Enable strict mode"
    required: false
    default: "false"

  changed-only:
    description: "Scan only new or changed SQL files"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run SQL validation
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/check_sql_no_database_prefix.sh"
        STRICT_MODE="${{ inputs.strict }}" \
        CHANGED_ONLY="${{ inputs.changed-only }}" \
        "${{ github.action_path }}/check_sql_no_database_prefix.sh" "${{ inputs.sql-path }}"

